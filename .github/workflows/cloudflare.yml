name: Triển khai Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Kiểm tra cấu hình triển khai
        id: config
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Chưa triển khai: cần thêm CLOUDFLARE_API_TOKEN và CLOUDFLARE_ACCOUNT_ID vào Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then exit 1; fi
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Kiểm tra và triển khai
        if: steps.config.outputs.ready == 'true'
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
          node scripts/deploy-cloudflare.mjs
